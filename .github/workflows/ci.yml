name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # One version, read from .nvmrc — the same file the Dockerfile pins to and
      # local shells pick up. Testing a version nothing deploys proves nothing;
      # testing several hides which one production actually runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is a native module, so this compiles on first install.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # No API keys: the suite stubs the network and fails loudly on any real
        # call, so a leaked live request breaks the build rather than the bill.
        run: npm run test -- --reporter=default --reporter=github-actions

      - name: Build
        run: npm run build

  # The unit tests run on the runner's Node; they do not prove the *image* works.
  # The server starts from TypeScript through tsx, so esbuild runs in production
  # — and an image can build green and still die on boot. This runs on amd64,
  # the deploy host's architecture, which a Mac cannot test without emulation.
  image:
    name: Image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t leadman:ci .

      - name: Boot it and check health
        run: |
          set -euo pipefail
          docker run -d --name leadman-ci -p 8787:8787 \
            -e LEADMAN_SCHEDULER=off leadman:ci
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/api/health; then
              echo
              echo "Booted on $(docker exec leadman-ci node --version)"
              exit 0
            fi
            # A crashed container will never become healthy; fail fast.
            if [ "$(docker inspect -f '{{.State.Running}}' leadman-ci)" != "true" ]; then
              echo "::error::The container exited during startup"
              docker logs leadman-ci
              exit 1
            fi
            sleep 2
          done
          echo "::error::/api/health never responded"
          docker logs leadman-ci
          exit 1

  # Cheap guard against the two mistakes that actually happen in this repo.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The whole point of a single Node version is that dev, CI and production
      # cannot drift. Nothing enforces that except this check.
      - name: Node version is consistent everywhere
        run: |
          set -euo pipefail
          nvmrc=$(tr -d '[:space:]' < .nvmrc)
          docker=$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile | tr -d '[:space:]')
          engines=$(node -p "require('./package.json').engines.node")
          fail=0
          if [ "$nvmrc" != "$docker" ]; then
            echo "::error file=Dockerfile::Dockerfile pins Node $docker but .nvmrc says $nvmrc"
            fail=1
          fi
          if [ ">=${nvmrc%%.*}" != "$engines" ]; then
            echo "::error file=package.json::engines.node is '$engines' but .nvmrc says $nvmrc (expected '>=${nvmrc%%.*}')"
            fail=1
          fi
          [ $fail -eq 0 ] && echo "Node $nvmrc — .nvmrc, Dockerfile and engines agree"
          exit $fail

      - name: No committed secrets or database
        run: |
          set -euo pipefail
          fail=0
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git — it holds API keys and must stay ignored"
            fail=1
          fi
          if git ls-files | grep -qE '\.db$|\.sqlite$'; then
            echo "::error::A database file is tracked by git; data/ should stay ignored"
            fail=1
          fi
          if git grep -nE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20}|sk-proj-[A-Za-z0-9_-]{20}' \
               -- ':!*.md' ':!.github/**' >/dev/null 2>&1; then
            echo "::error::A live-looking API key is committed in the source"
            fail=1
          fi
          exit $fail
